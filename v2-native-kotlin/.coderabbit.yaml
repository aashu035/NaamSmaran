# .coderabbit.yaml — Naam Smaran (नाम स्मरण) v2-native-kotlin
# AI-powered code review configuration for CodeRabbit
# जय श्री हित हरिवंश महाप्रभु 🙏

language: "en-US"

reviews:
  # Review profile — balanced: catches bugs without being noisy
  profile: "assertive"

  # Request changes mode for critical bugs; comment for style
  request_changes_workflow: true

  # High-level summary of what changed in each PR
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"

  # Auto-review on every push (not just PRs)
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "develop"

  # Path filters — skip generated and resource files
  path_filters:
    - "!**/*.xml"                  # Android resource XML (generated or hand-edited, not logic)
    - "!**/build/**"               # Build outputs
    - "!**/.gradle/**"             # Gradle cache
    - "!**/res/drawable*/**"       # Image assets
    - "!**/res/mipmap*/**"         # Launcher icons
    - "!**/res/font/**"            # Font assets
    - "!gradlew"
    - "!gradlew.bat"

  # Path-specific review instructions
  path_instructions:
    - path: "app/src/main/java/com/radhavallabh/naamsmaran/engine/**"
      instructions: |
        This is the core formula engine. Review strictly for:
        - Correctness of the doubling formula: T(n+1) = D(n) >= T(n) ? D(n) + 5000 : T(n) + (T(n) - D(n))
        - Day boundary logic must use 3:00 AM as the day cutoff, NOT midnight.
        - Never change initialTarget from 21600 without explicit approval.
        - Thread-safety: all mutations must go through the repository coroutine scope.

    - path: "app/src/main/java/com/radhavallabh/naamsmaran/ui/screens/home/**"
      instructions: |
        HomeScreen is a Zero-UI darshan experience. Review for:
        - Gesture detection must cover the FULL screen — no Scaffold padding that shrinks the touch area.
        - Counter must auto-hide after 3.5s and re-appear for 3.5s after bottom sheet close.
        - No extra navigation bars, bottom nav pills, or floating action buttons.
        - Swipe threshold for bottom sheet: >= 120dp upward drag.

    - path: "app/src/main/java/com/radhavallabh/naamsmaran/ui/components/GlassBottomSheet.kt"
      instructions: |
        GlassBottomSheet must:
        - React to isExpanded changes via LaunchedEffect (not just initial remember{}).
        - Use spring animation with DampingRatioMediumBouncy for physical feel.
        - Support snap points: collapsed (92%), half (50%), expanded (15%) of screen height.
        - Apply RenderEffect blur ONLY on Android 12+ (Build.VERSION_CODES.S).

    - path: "app/src/main/java/com/radhavallabh/naamsmaran/ui/components/ImageShowreelBackground.kt"
      instructions: |
        Showreel must:
        - Show the first image IMMEDIATELY (index 0 at startup, delay comes AFTER).
        - Have a deep indigo background (0xFF0D0A1E) to prevent black flash during decode.
        - Crossfade duration: 1500ms. Interval: 6000ms.
        - Gallery (user URI) images interleave with bundled drawables.

    - path: "app/src/main/java/com/radhavallabh/naamsmaran/ui/theme/**"
      instructions: |
        Theme rules:
        - No hardcoded color values in any composable — all colors from the theme system.
        - No Om (ॐ), no trishul, no non-Radhavallabh Sampraday symbols anywhere.
        - Default theme: Sharad Moon (deep indigo + pink lotus palette).

    - path: "app/src/main/java/com/radhavallabh/naamsmaran/data/**"
      instructions: |
        Data layer rules:
        - Room entities must have proper @PrimaryKey and indexes.
        - DataStore operations must be suspend functions or Flow.
        - No business logic in Repository — delegate to the engine layer.

  # Tone of review comments
  tone_instructions: |
    Be concise and direct. Focus on bugs and correctness over style.
    Use "Bug:", "Warning:", "Suggestion:" prefixes to triage severity.
    Acknowledge the devotional context — comments about UI must respect the
    Radhavallabh Sampraday design philosophy (no Om, no trishul symbols).

# Chat configuration
chat:
  auto_reply: true

# Finishing touches
finishing_touches:
  docstrings:
    enabled: false  # KDoc comments are already well-maintained manually
  unit_tests:
    enabled: true   # Suggest unit tests for engine and ViewModel logic
